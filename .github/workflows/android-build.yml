name: Android Build

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ "main", "feat/**", "fix/**" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
    - name: Verify required secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then exit 1; fi
    - name: Verify Supabase configuration
      run: |
        if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then exit 1; fi
    - name: Remove invalid empty launcher resources
      run: find android/app/src/main/res -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' \) -size 0 -delete
    - name: Prepare official CartaDigitalQR app icon
      run: |
        ICON_SOURCE="docs/REFERENCIAS/ICONO_APP/app-icon.png"
        ICON_TARGET="android/app/src/main/res/drawable-nodpi/app_icon.png"
        test -s "$ICON_SOURCE"
        mkdir -p "$(dirname "$ICON_TARGET")"
        cp "$ICON_SOURCE" "$ICON_TARGET"
    - name: Decode release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
        chmod 600 android/app/release.jks
    - name: Build signed Release APK
      env:
        KEYSTORE_FILE: release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew assembleRelease
        VERSION_NAME=$(sed -n 's/.*val appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
        test -n "$VERSION_NAME"
        cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/carta_v${VERSION_NAME}.apk"
    - name: Verify APK signature
      run: |
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
        VERSION_NAME=$(sed -n 's/.*val appVersionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
        "$APKSIGNER" verify --verbose --print-certs "android/app/build/outputs/apk/release/carta_v${VERSION_NAME}.apk"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: carta_v${{ github.event_name == 'workflow_dispatch' && 'manual' || 'build' }}
        if-no-files-found: error
        retention-days: 30
        path: android/app/build/outputs/apk/release/carta_v*.apk
    - name: Publish APK to GitHub Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION_NAME=$(sed -n 's/.*val appVersionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
        gh release create "v${VERSION_NAME}" "android/app/build/outputs/apk/release/carta_v${VERSION_NAME}.apk" --title "CartaDigitalQR v${VERSION_NAME}" --notes "APK oficial CartaDigitalQR ${VERSION_NAME}." --latest
    - name: Remove release keystore
      if: always()
      run: rm -f android/app/release.jks
