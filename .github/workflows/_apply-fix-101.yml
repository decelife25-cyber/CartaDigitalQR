name: Apply Android product fixes

on:
  push:
    branches: [ "feat/android-admin-buttons" ]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auto-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          product = Path('android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductosScreen.kt')
          text = product.read_text()

          old = 'val canReorder = search.isBlank() && sortMode == SortMode.ORDEN && !savingOrder'
          new = 'val canReorder = search.isBlank() && sortMode == SortMode.ORDEN'
          if old not in text:
              raise SystemExit('Expected canReorder line not found')
          text = text.replace(old, new, 1)

          old_row = '''            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                AdminFilterChip(if (familiaId == "todas") "Familia: Todas" else "Familia: ${familyById[familiaId]?.nombre ?: "Todas"}", Modifier.weight(1f)) { dialog = "familia" }
                AdminFilterChip(statusFilter.label, Modifier.weight(1f)) { dialog = "estado" }
                Box(Modifier.size(36.dp).clip(RoundedCornerShape(12.dp)).border(1.dp, if (sortMode != SortMode.ORDEN) Color(0xFFF97316) else AppBorder, RoundedCornerShape(12.dp)).clickable { dialog = "orden" }, contentAlignment = Alignment.Center) { Icon(Icons.Default.FilterList, "Filtrar y ordenar", tint = if (sortMode != SortMode.ORDEN) Color(0xFFF97316) else AppMuted, modifier = Modifier.size(18.dp)) }
            }'''
          new_row = '''            BoxWithConstraints(Modifier.fillMaxWidth()) {
                if (maxWidth < 340.dp) {
                    Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                        AdminFilterChip(if (familiaId == "todas") "Familia: Todas" else "Familia: ${familyById[familiaId]?.nombre ?: "Todas"}", Modifier.fillMaxWidth()) { dialog = "familia" }
                        Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                            AdminFilterChip(statusFilter.label, Modifier.weight(1f)) { dialog = "estado" }
                            Box(Modifier.size(36.dp).clip(RoundedCornerShape(12.dp)).border(1.dp, if (sortMode != SortMode.ORDEN) Color(0xFFF97316) else AppBorder, RoundedCornerShape(12.dp)).clickable { dialog = "orden" }, contentAlignment = Alignment.Center) { Icon(Icons.Default.FilterList, "Filtrar y ordenar", tint = if (sortMode != SortMode.ORDEN) Color(0xFFF97316) else AppMuted, modifier = Modifier.size(18.dp)) }
                        }
                    }
                } else {
                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        AdminFilterChip(if (familiaId == "todas") "Familia: Todas" else "Familia: ${familyById[familiaId]?.nombre ?: "Todas"}", Modifier.weight(1.4f)) { dialog = "familia" }
                        AdminFilterChip(statusFilter.label, Modifier.weight(0.85f)) { dialog = "estado" }
                        Box(Modifier.size(36.dp).clip(RoundedCornerShape(12.dp)).border(1.dp, if (sortMode != SortMode.ORDEN) Color(0xFFF97316) else AppBorder, RoundedCornerShape(12.dp)).clickable { dialog = "orden" }, contentAlignment = Alignment.Center) { Icon(Icons.Default.FilterList, "Filtrar y ordenar", tint = if (sortMode != SortMode.ORDEN) Color(0xFFF97316) else AppMuted, modifier = Modifier.size(18.dp)) }
                    }
                }
            }'''
          if old_row not in text:
              raise SystemExit('Expected filter row not found')
          text = text.replace(old_row, new_row, 1)

          old_chip = '''@Composable private fun AdminFilterChip(text: String, modifier: Modifier = Modifier, onClick: () -> Unit) { Row(modifier.height(36.dp).clip(RoundedCornerShape(12.dp)).border(1.dp, AppBorder, RoundedCornerShape(12.dp)).clickable(onClick = onClick).padding(horizontal = 8.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) { Text(text, fontSize = 12.sp, fontWeight = FontWeight.Bold, maxLines = 1); Text("⌄", color = AppMuted, fontSize = 14.sp) } }'''
          new_chip = '''@Composable private fun AdminFilterChip(text: String, modifier: Modifier = Modifier, onClick: () -> Unit) { Row(modifier.height(36.dp).clip(RoundedCornerShape(12.dp)).border(1.dp, AppBorder, RoundedCornerShape(12.dp)).clickable(onClick = onClick).padding(horizontal = 8.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) { Text(text, modifier = Modifier.weight(1f), fontSize = 11.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis); Text("⌄", color = AppMuted, fontSize = 14.sp, modifier = Modifier.padding(start = 4.dp)) } }'''
          if old_chip not in text:
              raise SystemExit('Expected AdminFilterChip not found')
          text = text.replace(old_chip, new_chip, 1)

          product.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          if 'val appVersionName = "1.0.100"' not in g:
              raise SystemExit('Expected version 1.0.100 not found')
          g = g.replace('val appVersionName = "1.0.100"', 'val appVersionName = "1.0.101"', 1)
          gradle.write_text(g)
          PY

          git diff --check
          git diff -- android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductosScreen.kt android/app/build.gradle.kts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductosScreen.kt android/app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "fix(android): unlock product reordering and widen family filter [auto-fix]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/_apply-fix-101.yml
          git commit -m "chore: remove temporary patch workflow [auto-fix]"
          git push
