name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Pages
        env:
          CF_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Diagnose and ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CARTADIGITALQR_CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"

          echo "Checking Cloudflare Pages projects..."
          response=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -w '\nHTTP_STATUS:%{http_code}' \
            "$endpoint")

          body="${response%$'\nHTTP_STATUS:'*}"
          status="${response##*$'\nHTTP_STATUS:'}"

          echo "Cloudflare GET HTTP status: ${status}"
          echo "Cloudflare GET response:"
          echo "$body" | jq .

          if [ "$status" != "200" ]; then
            echo "Cloudflare rejected the Pages projects request."
            exit 1
          fi

          if echo "$body" | jq -e '.result[] | select(.name == "cartadigitalqr")' >/dev/null; then
            echo "Cloudflare Pages project cartadigitalqr already exists."
          else
            echo "Creating Cloudflare Pages project cartadigitalqr..."
            create_response=$(curl -sS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -w '\nHTTP_STATUS:%{http_code}' \
              "$endpoint" \
              --data '{"name":"cartadigitalqr","production_branch":"main"}')

            create_body="${create_response%$'\nHTTP_STATUS:'*}"
            create_status="${create_response##*$'\nHTTP_STATUS:'}"

            echo "Cloudflare POST HTTP status: ${create_status}"
            echo "Cloudflare POST response:"
            echo "$create_body" | jq .

            if [ "$create_status" != "200" ]; then
              echo "Cloudflare rejected project creation."
              exit 1
            fi

            echo "$create_body" | jq -e '.success == true' >/dev/null
            echo "Cloudflare Pages project created."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CARTADIGITALQR_CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CARTADIGITALQR_CLOUDFLARE }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cartadigitalqr
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
