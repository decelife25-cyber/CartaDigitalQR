name: Import Erudus allergen icons

on: push

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace previous allergen assets with original Erudus SVGs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/Erudus/erudus-icons/master/src/svg'
          DEST='public/icons/alergenos/erudus'

          mkdir -p "$DEST"
          rm -f public/icons/alergenos/*.svg
          rm -f public/icons/alergenos/MAKRO-LICENSE-AND-SOURCE.md

          files=(
            cereal.svg
            crustaceans.svg
            eggs.svg
            fish.svg
            peanuts.svg
            soya.svg
            milk.svg
            nuts.svg
            celery.svg
            mustard.svg
            sesame.svg
            so2.svg
            lupin.svg
            molluscs.svg
          )

          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location "$BASE/$file" -o "$DEST/$file"
          done

          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/Erudus/erudus-icons/master/LICENSE' \
            -o "$DEST/LICENSE"

          cat > "$DEST/SOURCE.md" <<'EOF'
# Erudus Food Allergen Icons

These SVG assets are the original source files from the official Erudus icon repository.

- Original repository: https://github.com/Erudus/erudus-icons
- Source directory: https://github.com/Erudus/erudus-icons/tree/master/src/svg
- License: MIT
- Copyright: (c) 2016 Erudus Ltd

The SVG artwork is stored here without redrawing or alteration. The application may control presentation (size, colour and surrounding UI) without changing the original source assets.

The previous Makro allergen assets have been removed from this directory so there is only one authoritative icon set in the application.
EOF

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/icons/alergenos
          if git diff --cached --quiet; then
            echo 'No allergen asset changes.'
            exit 0
          fi
          git commit -m 'assets: replace allergen icons with Erudus originals'
          git push origin HEAD:${GITHUB_REF_NAME}
