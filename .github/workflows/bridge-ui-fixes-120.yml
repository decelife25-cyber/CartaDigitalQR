name: Bridge UI fixes 1.0.120

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes to target branch
        env:
          TARGET_BRANCH: fix/ui-product-delete-rice-note-120
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/one-time-ui-fixes-120.yml').read_text()
          marker = 'python3 <<\'PY\'\n'
          if marker not in workflow:
              raise SystemExit('Embedded fix script not found')
          script = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(dedent(script), {'Path': Path})
          PY
          rm -f .github/workflows/one-time-ui-fixes-120.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android src .github/workflows/one-time-ui-fixes-120.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: improve product management and rice pricing note"
          git push origin "$TARGET_BRANCH"

      - name: Remove bridge workflow from main
        run: |
          git checkout main
          rm -f .github/workflows/bridge-ui-fixes-120.yml
          git add .github/workflows/bridge-ui-fixes-120.yml
          git commit -m "chore: remove temporary UI fix bridge"
          git push origin main
