name: Apply UI fixes 1.0.120

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply requested UI and product fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/HomeScreen.kt', 'HomeSectionItem("Familias", "Organiza las categorías de la carta.", Icons.Filled.FolderOpen, AccentPurple, onNavigateToFamilias)\n                HomeSectionItem("Productos", "Crea, edita y ordena los platos.", Icons.Filled.Inventory2, AccentOrange, onNavigateToProductos)', 'HomeSectionItem("Familias", "Organiza las categorías de la carta.", Icons.Filled.AutoAwesomeMosaic, AccentPurple, onNavigateToFamilias)\n                HomeSectionItem("Productos", "Crea, edita y ordena los platos.", Icons.Filled.RestaurantMenu, AccentOrange, onNavigateToProductos)')
