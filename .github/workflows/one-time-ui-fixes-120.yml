          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductosScreen.kt', 'Box(Modifier.size(50.dp).clip(RoundedCornerShape(10.dp)).background(Color(0xFFFAF5EE)), contentAlignment = Alignment.Center) { if (!product.foto_url.isNullOrBlank()) AsyncImage(model = product.foto_url, contentDescription = product.nombre, modifier = Modifier.fillMaxSize().clip(RoundedCornerShape(10.dp))) else Icon(Icons.Default.Image, null, tint = Color(0xFF8C6A48), modifier = Modifier.size(24.dp)) }', 'Box(Modifier.size(50.dp).clip(RoundedCornerShape(10.dp)).background(Color(0xFFFFF7E8)), contentAlignment = Alignment.Center) { if (!product.foto_url.isNullOrBlank()) AsyncImage(model = product.foto_url, contentDescription = product.nombre, modifier = Modifier.fillMaxSize().clip(RoundedCornerShape(10.dp))) else Icon(Icons.Default.RestaurantMenu, null, tint = Color(0xFFE08A00), modifier = Modifier.size(28.dp)) }')
          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/FamiliaEditorScreen.kt', 'else Icon(Icons.Default.Image, null, tint = AppMuted, modifier = Modifier.size(30.dp))', 'else Icon(Icons.Default.AutoAwesomeMosaic, null, tint = AccentPurple, modifier = Modifier.size(30.dp))')
          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/FamiliaEditorScreen.kt', 'Icon(Icons.Default.DeleteOutline, "Eliminar", tint = ErrorText, modifier = Modifier.size(20.dp))', 'Icon(Icons.Default.RemoveCircleOutline, "Eliminar", tint = ErrorText, modifier = Modifier.size(21.dp))')
          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductoEditorScreen.kt', 'var message by remember { mutableStateOf<String?>(null) }\n    val scope = rememberCoroutineScope()', 'var message by remember { mutableStateOf<String?>(null) }\n    var confirmDelete by remember { mutableStateOf(false) }\n    val scope = rememberCoroutineScope()')
          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductoEditorScreen.kt', 'IconButton(onClick = { message = "La eliminación requiere confirmación." }, modifier = Modifier.size(32.dp)) {\n                    Icon(Icons.Default.DeleteOutline, "Eliminar", tint = ErrorText, modifier = Modifier.size(20.dp))\n                }', 'IconButton(onClick = { confirmDelete = true }, enabled = !saving, modifier = Modifier.size(32.dp)) {\n                    Icon(Icons.Default.RemoveCircleOutline, "Eliminar", tint = ErrorText, modifier = Modifier.size(21.dp))\n                }')
          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductoEditorScreen.kt', 'else Icon(Icons.Default.Image, null, tint = AppMuted, modifier = Modifier.size(28.dp))', 'else Icon(Icons.Default.RestaurantMenu, null, tint = Color(0xFFE08A00), modifier = Modifier.size(28.dp))')
          replace('android/app/src/main/java/com/decelife/cartadigitalqr/screens/ProductoEditorScreen.kt', '    }\n}\n\n@Composable\nprivate fun SectionCard(content: @Composable () -> Unit) {', '''    }

    if (confirmDelete) {
        AlertDialog(
            onDismissRequest = { if (!saving) confirmDelete = false },
            title = { Text("¿Eliminar producto?") },
            text = { Text("Se eliminará «${nombre.trim()}». Esta acción no se puede deshacer.") },
            confirmButton = {
                TextButton(onClick = {
                    val id = productId ?: return@TextButton
                    confirmDelete = false
                    saving = true
                    scope.launch {
                        try {
                            SupabaseRepository.deleteProducto(id)
                            onBack()
                        } catch (e: Exception) {
                            message = e.message ?: "No se pudo eliminar el producto."
                        } finally {
                            saving = false
                        }
                    }
                }, enabled = !saving) { Text("Eliminar", color = ErrorText) }
            },
            dismissButton = { TextButton(onClick = { confirmDelete = false }, enabled = !saving) { Text("Cancelar") } }
        )
    }
}

