          replace('android/app/src/main/java/com/decelife/cartadigitalqr/data/SupabaseRepository.kt', '    suspend fun updateProductoFields(id: String, fields: Map<String, Any?>) {\n        val payload = JSONObject().apply { fields.forEach { (key, value) -> put(key, value ?: JSONObject.NULL) } }\n        request("PATCH", "productos?id=eq.$id", payload.toString())\n    }', '    suspend fun updateProductoFields(id: String, fields: Map<String, Any?>) {\n        val payload = JSONObject().apply { fields.forEach { (key, value) -> put(key, value ?: JSONObject.NULL) } }\n        request("PATCH", "productos?id=eq.$id", payload.toString())\n    }\n\n    suspend fun deleteProducto(id: String) {\n        request("DELETE", "producto_alergeno?producto_id=eq.$id")\n        request("DELETE", "productos?id=eq.$id")\n    }')
          replace('src/pages/ListadoPlatos.tsx', "const PIZARRA_IMAGE = 'https://raw.githubusercontent.com/decelife25-cyber/CartaDigitalQR/main/docs/REFERENCIAS/ICONOS/pizarra.png?v=1';", "const PIZARRA_IMAGE = 'https://raw.githubusercontent.com/decelife25-cyber/CartaDigitalQR/main/docs/REFERENCIAS/ICONOS/pizarra.png?v=1';\nconst RICE_NOTE = 'Precio por persona · Mínimo 2 personas';")
          replace('src/pages/ListadoPlatos.tsx', "  const familyName = isSuggestions ? 'Sugerencias' : familia?.nombre || 'Resultados de búsqueda'; const heading = isSuggestions ? 'Sugerencias' : isSearch ? `Resultados para «${searchQuery}»` : familyName; const toggleSelection = (productoId: string) => { if (isSelected(productoId)) removeSelection(productoId); else addSelection(productoId); };", "  const familyName = isSuggestions ? 'Sugerencias' : familia?.nombre || 'Resultados de búsqueda'; const heading = isSuggestions ? 'Sugerencias' : isSearch ? `Resultados para «${searchQuery}»` : familyName; const isRiceFamily = normalize(familyName) === 'arroces'; const toggleSelection = (productoId: string) => { if (isSelected(productoId)) removeSelection(productoId); else addSelection(productoId); };")
