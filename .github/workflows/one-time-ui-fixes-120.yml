          replace('src/pages/FichaPlato.tsx', "function IndicadoresProducto({ producto }: { producto: Producto }) { if (!producto.destacado && !producto.sugerido) return null; return <div className=\"mt-3 flex w-full items-start gap-2\" aria-label=\"Indicadores del producto\"><div className=\"flex min-w-0 flex-col items-start gap-2\">{producto.destacado && <span className=\"inline-flex max-w-full items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-extrabold uppercase tracking-wide\" style={{ borderColor: '#f59e0b', color: '#d97706', background: 'rgba(245,158,11,.08)' }}><span className=\"text-sm leading-none\" aria-hidden=\"true\">👨‍🍳</span>ESPECIALIDAD</span>}{producto.sugerido && <span className=\"inline-flex max-w-full items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-extrabold uppercase tracking-wide\" style={{ borderColor: '#10b981', color: '#059669', background: 'rgba(16,185,129,.08)' }}><Lightbulb className=\"h-3.5 w-3.5\" />SUGERENCIA</span>}</div><div className=\"ml-auto shrink-0 rounded-2xl px-4 py-2 text-xl font-extrabold\" style={{ background: 'var(--app-surface-soft)', color: 'var(--app-text)' }}>{producto.precio.toFixed(2)}€</div></div>; }", "function IndicadoresProducto({ producto }: { producto: Producto }) { if (!producto.destacado && !producto.sugerido) return null; return <div className=\"mt-3 flex w-full items-start gap-2\" aria-label=\"Indicadores del producto\"><div className=\"flex min-w-0 flex-col items-start gap-2\">{producto.destacado && <span className=\"inline-flex max-w-full items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-extrabold uppercase tracking-wide\" style={{ borderColor: '#f59e0b', color: '#d97706', background: 'rgba(245,158,11,.08)' }}><span className=\"text-sm leading-none\" aria-hidden=\"true\">👨‍🍳</span>ESPECIALIDAD</span>}{producto.sugerido && <span className=\"inline-flex max-w-full items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-extrabold uppercase tracking-wide\" style={{ borderColor: '#10b981', color: '#059669', background: 'rgba(16,185,129,.08)' }}><Lightbulb className=\"h-3.5 w-3.5\" />SUGERENCIA</span>}</div><div className=\"ml-auto shrink-0 rounded-2xl px-4 py-2 text-xl font-extrabold\" style={{ background: 'var(--app-surface-soft)', color: 'var(--app-text)' }}>{producto.precio.toFixed(2)}€</div></div>; }\n\nfunction cleanRiceDescription(description: string | null, isRice: boolean): string | null { if (!description) return null; if (!isRice) return description; const cleaned = description.replace(/precio por persona\\.?\\s*mínimo 2 personas\\.?/gi, '').trim(); return cleaned || null; }")
          replace('src/pages/FichaPlato.tsx', "  const { id } = useParams<{ id: string }>(); const navigate = useNavigate(); const [producto, setProducto] = useState<Producto | null>(null); const [loading, setLoading] = useState(true); const { isSelected, addSelection, removeSelection } = useSelectionStore();", "  const { id } = useParams<{ id: string }>(); const navigate = useNavigate(); const [producto, setProducto] = useState<Producto | null>(null); const [familiaNombre, setFamiliaNombre] = useState(''); const [loading, setLoading] = useState(true); const { isSelected, addSelection, removeSelection } = useSelectionStore();")
